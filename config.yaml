# ===== Single source of truth. Every script reads this file. =====

# ---- AOI: EDIT THIS BLOCK ----
aoi:
  name: netherlands
  mode: admin                        # use the country outline as the AOI
  bbox_4326: [3.2, 50.7, 7.3, 53.6]  # national envelope, used until the outline is downloaded
  buffer_m: 0
  country_iso3: NLD
  admin_levels: [ADM0, ADM1, ADM2]

crs:
  storage: "EPSG:4326"
  project: "EPSG:28992"
  
model:
  dem_resolution_m: 30
  return_periods_yr: [10, 25, 50, 100]
  design_duration_h: 24
  depth_tiers_m: [0.3, 0.5, 1.0]
  h3_resolutions: [8, 9]

paths:
  raw: data/raw
  processed: data/processed
  models: models
  outputs: outputs
  manifest: data_manifest.csv
  checksums: data_checksums.csv
